# joi-button — single-host Docker deployment.
#
# The SAME web and api images the k3s deployment uses, with Traefik doing the
# job the k3s Ingress does: route Host(APP_HOST) — /api* to the api, everything
# else to the web — and terminate TLS. Keeping Traefik on both paths means one
# routing/TLS model to reason about, not two.
#
# TLS is layered on by an override file, so this base file is mode-agnostic:
#   Let's Encrypt (auto):   docker compose -f docker-compose.yml -f compose.le.yml   up -d
#   Your own certificate:   docker compose -f docker-compose.yml -f compose.cert.yml up -d
# The bootstrap picks the override for you; run either by hand for the same
# result. Values come from a .env file beside this one (see env.example) —
# APP_HOST and the image tag at least.
#
# Nothing here publishes a host port except Traefik's :80/:443. The api and web
# containers are on the internal compose network only, reached through Traefik,
# the same isolation the ClusterIP services have on k3s.

name: joi-button

x-images:
  api: &api-image "ghcr.io/tpmoonchefryan/joi-button/api:${IMAGE_TAG:?set IMAGE_TAG in .env}"
  web: &web-image "ghcr.io/tpmoonchefryan/joi-button/web:${IMAGE_TAG:?set IMAGE_TAG in .env}"

volumes:
  joi-data:        # the shared volume: api writes it, web reads it
  traefik-acme:    # Let's Encrypt account + issued certs (used only in LE mode)

networks:
  joi:

services:
  # A one-shot that gives the shared volume to uid 101 before anyone else mounts
  # it — the job k8s fsGroup does. The images run as 101 with a read-only root
  # filesystem, so a fresh root-owned volume would otherwise be unwritable to the
  # api and the whole thing would fail on the first write.
  data-init:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /srv/shared && chown -R 101:101 /srv/shared"]
    volumes:
      - joi-data:/srv/shared
    restart: "no"
    networks: [joi]

  api:
    image: *api-image
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    # The operator secrets, exactly the file bootstrap.sh writes.
    env_file:
      - ./runtime.env
    # The non-secret settings the k8s Deployment sets in its own env — copied
    # verbatim so the container behaves identically to the cluster one. These
    # override any same-named line in runtime.env (compose precedence), which is
    # why DATA_DIR here is the container path, not runtime.env's local ./.data.
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      DATA_DIR: /srv/shared
      TRUST_PROXY: "1"
      CODE_TTL_MINUTES: "10"
      LOG_LEVEL: info
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - joi-data:/srv/shared
    networks: [joi]
    labels:
      - traefik.enable=true
      - "traefik.http.routers.joi-api.rule=Host(`${APP_HOST:?set APP_HOST in .env}`) && PathPrefix(`/api`)"
      - traefik.http.routers.joi-api.entrypoints=websecure
      - traefik.http.routers.joi-api.tls=true
      - traefik.http.services.joi-api.loadbalancer.server.port=8080

  web:
    image: *web-image
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    volumes:
      - joi-data:/srv/shared:ro
    networks: [joi]
    labels:
      - traefik.enable=true
      # No PathPrefix: this is the catch-all. Traefik ranks a longer rule higher,
      # so the api router's `Host && PathPrefix(/api)` wins for /api and this wins
      # for everything else — the same split the Ingress makes.
      - "traefik.http.routers.joi-web.rule=Host(`${APP_HOST:?set APP_HOST in .env}`)"
      - traefik.http.routers.joi-web.entrypoints=websecure
      - traefik.http.routers.joi-web.tls=true
      - traefik.http.services.joi-web.loadbalancer.server.port=8080

  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=joi-button_joi
      # A file provider for the own-certificate mode; harmless when the dir is
      # empty (Let's Encrypt mode leaves it empty).
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Every plain-HTTP request is redirected to HTTPS. A Secure session cookie
      # is dropped over http, so serving the app there would be a login that
      # silently never completes; the redirect makes that unrepresentable.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only docker socket: Traefik reads container labels to build its
      # routes and does nothing else with it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks: [joi]
