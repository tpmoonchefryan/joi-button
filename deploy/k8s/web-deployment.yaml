# SPDX-License-Identifier: MIT
#
# joi-button — the static site workload: nginx serving the vue-cli `dist/` build
# that was baked into the image.
#
# The securityContext, revisionHistoryLimit, probe and resource shape mirror the
# operator's house style for API workloads. The SIZING deliberately does not:
# those are Node servers with a database behind them, this is nginx reading a
# 4.4MB tree off local disk and doing no work per request.
#
# `imagePullPolicy: IfNotPresent` is load-bearing, not a default left in place.
# The first verification path puts the image into the node's containerd directly
# (`docker save` | `k3s ctr images import`) under its GHCR name, so the tag may
# exist on the node while existing nowhere in a registry. `Always` would break
# that. See ./README.md, "Image delivery".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joi-button-web
  namespace: joi-button
  labels:
    app.kubernetes.io/name: joi-button-web
    app.kubernetes.io/part-of: joi-button
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # DEVIATION from the TMS api, which uses maxUnavailable 1 / maxSurge 0.
      # That workload holds a singleton position against a database; this one is
      # stateless, holds no lease, and two pods of ~24Mi cost nothing on this
      # node. Surging lets the replacement pass its readiness probe before the
      # old pod is removed, which is the difference between a rollout with a gap
      # in it and one without.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: joi-button-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joi-button-web
        app.kubernetes.io/part-of: joi-button
    spec:
      # This pod never talks to the API server. An unmounted token is one fewer
      # thing a compromised static-file server can reach.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/tpmoonchefryan/joi-button/web:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          # /healthz is `return 200 "ok"` in nginx.conf: it is answered by the
          # rewrite module and never touches the filesystem. So it proves the
          # process is alive and configured, and it CANNOT prove the document
          # root arrived — an image with an empty /usr/share/nginx/html answers
          # it exactly the same way. It is used for liveness/readiness precisely
          # because it is cheap and cannot be shadowed by the SPA fallback.
          #
          # The document root is covered by the startupProbe below instead, on
          # /index.html: that is an exact-match location with no try_files, so a
          # missing or empty index.html is a real 404 rather than the app shell.
          # Pointing a probe at `/` would NOT do this — `/` reaches index.html
          # through try_files, and any path answers 200 with the shell, which
          # would be a gate that cannot go red.
          startupProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 2
            # nginx binds in well under a second; 15 tries is ~30s of headroom
            # for a cold node without letting a genuinely broken image sit in
            # Pending-looking limbo for minutes.
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            # The API's volume, READ-ONLY. This pod serves catalog.json and the
            # published media straight off it, which is why there is no
            # cross-origin fetch and why the read path survives the API pod being
            # down — with current data, not with whatever the image was built
            # with. readOnly is not a formality: the web pod has no business
            # writing here and nginx runs as uid 101 either way.
            - name: shared
              mountPath: /srv/shared
              readOnly: true
      # With `readOnlyRootFilesystem: true`, nginx does not start unless the
      # paths it writes to are mounted writable. These two are the container
      # contract; which files land under them belongs to the image and its
      # nginx.conf, not to this manifest. `fsGroup` above is what makes the
      # emptyDirs writable by uid 101.
      #
      # Both are size-limited: a static file server has no legitimate reason to
      # grow either one, so an unbounded emptyDir here would only ever be a way
      # to fill the node's disk.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 16Mi
        # k3s's default local-path StorageClass is node-local, so this claim and
        # the API's are the same volume only because both pods land on the same
        # node — true on a single-node cluster and the first thing to revisit if
        # a second node ever joins.
        - name: shared
          persistentVolumeClaim:
            claimName: joi-button-data
            readOnly: true
